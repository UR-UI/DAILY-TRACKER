<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Hari Ini - Daily Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f4f7fc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-grad: linear-gradient(135deg, #2563eb, #3b82f6);
            --success: #10b981;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR (Sama persis dengan index.html) */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: fixed;
            height: 100vh;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.1rem; }
        .brand i { background: var(--primary-grad); color: white; padding: 10px; border-radius: 12px; }
        .brand span { font-size: 0.8rem; color: var(--primary); display: block; font-weight: 500; }
        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item a {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: var(--text-muted);
            text-decoration: none; font-weight: 500; font-size: 0.95rem; border-radius: 12px; transition: 0.2s;
        }
        .nav-item.active a, .nav-item a:hover { background: #eff6ff; color: var(--primary); font-weight: 600; }

        /* CONTENT AREA */
        .main-content { margin-left: 260px; flex: 1; padding: 32px; max-width: 800px; }
        .card { background: var(--bg-card); border-radius: 20px; padding: 24px; border: 1px solid var(--border); }
        .card-title-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        /* INPUT BOX & TASKS */
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-box input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        
        .task-list { display: flex; flex-direction: column; gap: 8px; }
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid #f1f5f9; }
        .task-item:hover { background: #f8fafc; border-radius: 8px; }
        .task-left { display: flex; align-items: center; gap: 14px; }
        .task-item input[type="checkbox"] { appearance: none; width: 22px; height: 22px; border: 2px solid #cbd5e1; border-radius: 50%; cursor: pointer; display: grid; place-content: center; }
        .task-item input[type="checkbox"]::before { content: "\f00c"; font-family: "Font Awesome 5 Free"; font-weight: 900; font-size: 0.7rem; color: white; display: none; }
        .task-item input[type="checkbox"]:checked { background: var(--success); border-color: var(--success); }
        .task-item input[type="checkbox"]:checked::before { display: block; }
        .task-text { font-size: 1rem; color: #334155; font-weight: 500; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }
        .btn-del { background: transparent; border: none; color: #ef4444; cursor: pointer; padding: 4px 8px; }

        /* PROGRESS BAR */
        .progress-container { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
        .progress-label-bar { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .progress-bg { height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-rocket"></i>
            <div>
                <p style="margin:0; line-height:1.2;">Daily Tracker</p>
                <span>Umar Edition</span>
            </div>
        </div>
        <div>
            <p class="nav-menu" style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; font-weight: 700;">Menu</p>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li class="nav-item active"><a href="target.html"><i class="fa-solid fa-check-square"></i> Target Hari Ini</a></li>
                <li class="nav-item"><a href="#"><i class="fa-solid fa-history"></i> Riwayat</a></li>
                <li class="nav-item"><a href="#"><i class="fa-solid fa-sliders"></i> Statistik</a></li>
                <li class="nav-item"><a href="#"><i class="fa-solid fa-award"></i> Achievement</a></li>
                <li class="nav-item"><a href="#"><i class="fa-solid fa-gear"></i> Pengaturan</a></li>
            </ul>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="card">
            <div class="card-title-container">
                <div class="card-title"><i class="fa-solid fa-bullseye" style="color:#ef4444"></i> Kelola Target Hari Ini</div>
            </div>
            
            <div class="input-box">
                <input id="taskInput" placeholder="Tambah target baru...">
                <button class="btn-add" onclick="addTask()">Simpan</button>
            </div>

            <div class="task-list" id="tasks"></div>

            <div class="progress-container">
                <div class="progress-label-bar">
                    <span>Progress Hari Ini</span>
                    <span id="barPercentText">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" id="bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BUSINESS LOGIC & FIREBASE SYNC -->
    <script>
        const todayKey = new Date().toISOString().split("T")[0];
        const dbUrl = "https://daily-tracker-umar-default-rtdb.asia-southeast1.firebasedatabase.app/tasks.json";
        
        let tasks = [];
        let xp = 0;
        let history = {};

        function saveAndPush() {
            let done = tasks.filter(t => t.done).length;
            let pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
            history[todayKey] = pct;

            fetch(dbUrl, {
                method: "PUT",
                body: JSON.stringify({ tasks, xp, history })
            }).catch(err => console.log("Firebase push error:", err));
        }

        function addTask() {
            let v = document.getElementById("taskInput").value.trim();
            if (!v) return;
            tasks.push({ name: v, done: false });
            document.getElementById("taskInput").value = "";
            updateUI();
            saveAndPush();
        }

        function toggleTask(i) {
            let before = tasks[i].done;
            tasks[i].done = !tasks[i].done;
            if (!before && tasks[i].done) xp += 10;
            if (before && !tasks[i].done) xp = Math.max(0, xp - 10);
            updateUI();
            saveAndPush();
        }

        function delTask(i) {
            if (confirm("Hapus target ini?")) {
                tasks.splice(i, 1);
                updateUI();
                saveAndPush();
            }
        }

        function updateUI() {
            let box = document.getElementById("tasks");
            box.innerHTML = "";
            tasks.forEach((t, i) => {
                box.innerHTML += `
                <div class="task-item ${t.done ? 'done' : ''}">
                    <div class="task-left">
                        <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask(${i})">
                        <span class="task-text">${t.name}</span>
                    </div>
                    <button class="btn-del" onclick="delTask(${i})"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });

            let done = tasks.filter(t => t.done).length;
            let pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
            document.getElementById("bar").style.width = pct + "%";
            document.getElementById("barPercentText").innerText = pct + "%";
        }

        function loadFromFirebase() {
            fetch(dbUrl)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        if (data.tasks) tasks = data.tasks;
                        if (data.xp) xp = data.xp;
                        if (data.history) history = data.history;
                        updateUI();
                    }
                }).catch(err => console.log("Firebase load error:", err));
        }

        document.getElementById("taskInput").addEventListener("keypress", e => {
            if (e.key === "Enter") addTask();
        });

        setInterval(loadFromFirebase, 3000);
        loadFromFirebase();
    </script>
</body>
</html>
